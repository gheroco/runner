name: Async runner foundation
on:
  push:
    branches: [feature/async-lease-broker]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runner-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build patched runner layout
        working-directory: src
        run: ./dev.sh layout Release linux-x64
      - name: Run runner L0 tests including renewal regression
        working-directory: src
        run: ./dev.sh test
